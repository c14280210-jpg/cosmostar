<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CosmoStars</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, sans-serif;
            background: #0a0a0a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            width: 100%;
            text-align: center;
        }
        h1 { font-size: 36px; color: #00ff88; margin-bottom: 8px; }
        .sub { font-size: 14px; opacity: 0.5; margin-bottom: 30px; }
        
        .card {
            background: rgba(0, 255, 136, 0.04);
            border: 1px solid rgba(0, 255, 136, 0.08);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 16px;
        }
        .balance { font-size: 32px; font-weight: 700; color: #00ff88; }
        .balance span { font-size: 16px; opacity: 0.5; display: block; margin-top: 4px; }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 10px;
            transition: all 0.15s;
        }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: #00ff88; color: #000; }
        .btn-secondary { background: rgba(0, 255, 136, 0.1); border: 1px solid rgba(0, 255, 136, 0.2); color: #00ff88; }
        
        .status {
            font-size: 14px;
            opacity: 0.6;
            margin-top: 12px;
            min-height: 24px;
        }
        .wallet-addr {
            font-size: 12px;
            opacity: 0.5;
            word-break: break-all;
            margin-top: 8px;
            padding: 8px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 12px;
        }
        .stats div {
            background: rgba(255,255,255,0.03);
            padding: 10px;
            border-radius: 10px;
        }
        .stats .num { font-size: 18px; font-weight: 700; color: #00ff88; }
        .stats .lbl { font-size: 10px; opacity: 0.5; }
        
        #splash {
            position: fixed;
            inset: 0;
            background: #0a0a0a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        #splash .logo { font-size: 42px; font-weight: 700; color: #00ff88; }
        .loader {
            width: 40px;
            height: 40px;
            margin-top: 20px;
            border: 3px solid rgba(0, 255, 136, 0.1);
            border-top: 3px solid #00ff88;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- ЗАСТАВКА -->
    <div id="splash">
        <div class="logo">🌌 CosmoStars</div>
        <div class="loader"></div>
    </div>

    <!-- ГОЛОВНИЙ ДОДАТОК -->
    <div id="app" style="display:none;">
        <div class="container">
            <h1>🌌 CosmoStars</h1>
            <div class="sub">Космические выигрыши</div>

            <div class="card">
                <div class="balance">
                    <span id="balance">0</span> ⭐
                    <span>Баланс</span>
                </div>
            </div>

            <button class="btn btn-primary" onclick="playSlot()">🎰 Играть (20⭐)</button>
            <button class="btn btn-secondary" onclick="connectWallet()">🔗 Подключить кошелек</button>

            <div class="status" id="status">Нажмите "Играть"</div>
            <div class="wallet-addr" id="wallet-addr">Кошелек не подключен</div>

            <div class="stats">
                <div><div class="num" id="games">0</div><div class="lbl">Игр</div></div>
                <div><div class="num" id="total-win">0⭐</div><div class="lbl">Выиграно</div></div>
                <div><div class="num" id="pets">0</div><div class="lbl">Питомцы</div></div>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. TELEGRAM
        // ============================================================
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ============================================================
        // 2. ID КОРИСТУВАЧА
        // ============================================================
        const urlParams = new URLSearchParams(window.location.search);
        const USER_ID = urlParams.get('user_id') || '1';

        // ============================================================
        // 3. СТАН
        // ============================================================
        let state = {
            balance: 0,
            freeSpins: 5,
            pets: [],
            petBonus: 0,
            totalGames: 0,
            totalWin: 0,
            isSpinning: false,
            wallet: null
        };

        // ============================================================
        // 4. ФУНКЦІЇ
        // ============================================================
        function loadData() {
            const saved = localStorage.getItem(`cosmostars_${USER_ID}`);
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    state = { ...state, ...data };
                } catch(e) {}
            }
            // Отримуємо баланс з Telegram Stars
            state.balance = tg.initDataUnsafe?.user?.stars || 0;
            updateUI();
            
            // Ховаємо заставку
            document.getElementById('splash').style.display = 'none';
            document.getElementById('app').style.display = 'block';
        }

        function saveData() {
            localStorage.setItem(`cosmostars_${USER_ID}`, JSON.stringify(state));
        }

        function updateUI() {
            // Баланс
            document.getElementById('balance').textContent = state.balance;
            
            // Статистика
            document.getElementById('games').textContent = state.totalGames;
            document.getElementById('total-win').textContent = state.totalWin + '⭐';
            document.getElementById('pets').textContent = state.pets.length;
            
            // Статус гаманця
            if (state.wallet) {
                document.getElementById('wallet-addr').textContent = '🔗 ' + state.wallet.slice(0, 10) + '...';
            } else {
                document.getElementById('wallet-addr').textContent = 'Кошелек не подключен';
            }
        }

        // ============================================================
        // 5. ІГРИ
        // ============================================================
        function playSlot() {
            if (state.isSpinning) return;
            if (state.balance < 20 && state.freeSpins <= 0) {
                document.getElementById('status').textContent = '❌ Недостаточно звезд!';
                return;
            }
            
            let isFree = false;
            if (state.freeSpins > 0) {
                state.freeSpins -= 1;
                isFree = true;
                document.getElementById('status').textContent = '🎁 Бесплатное вращение!';
            } else {
                state.balance -= 20;
                document.getElementById('status').textContent = '⏳ Крутим...';
            }
            
            state.isSpinning = true;
            saveData();
            updateUI();
            
            // Анімація
            setTimeout(() => {
                // Мінімальний шанс на виграш (5%)
                let win = 0;
                if (Math.random() < 0.05) {
                    win = Math.floor(Math.random() * 20) + 1;
                }
                
                if (win > 0) {
                    state.balance += win;
                    state.totalWin += win;
                    document.getElementById('status').textContent = `🎉 ВЫИГРЫШ! +${win}⭐`;
                } else {
                    document.getElementById('status').textContent = '😢 ПРОИГРЫШ';
                }
                
                state.totalGames += 1;
                state.isSpinning = false;
                saveData();
                updateUI();
            }, 1500);
        }

        function connectWallet() {
            // Симуляція підключення гаманця
            state.wallet = 'UQCpo8J4rvT70ITLXBhWfGcmkqjkTxsYM4u0-AUF0EmfE83P';
            saveData();
            updateUI();
            document.getElementById('status').textContent = '✅ Кошелек подключен!';
        }

        // ============================================================
        // 6. ОБРОБКА ПОВІДОМЛЕНЬ ВІД БОТА
        // ============================================================
        tg.onEvent('message', (msg) => {
            try {
                const data = JSON.parse(msg);
                if (data.action === 'wallet_connected') {
                    state.wallet = data.wallet;
                    saveData();
                    updateUI();
                    document.getElementById('status').textContent = '✅ Кошелек подключен!';
                }
                if (data.action === 'payment_success') {
                    document.getElementById('status').textContent = '✅ Платёж успешен!';
                    loadData();
                }
            } catch(e) {}
        });

        // ============================================================
        // 7. ЗАПУСК
        // ============================================================
        loadData();
        console.log('🚀 CosmoStars запущен!');
        console.log('👤 User ID:', USER_ID);
    </script>
</body>
</html>
