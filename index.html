<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>CosmoStars</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Заставка -->
    <div id="splash">
        <div class="logo">🌌 CosmoStars</div>
        <div class="loader"></div>
    </div>

    <!-- Головний додаток -->
    <div id="app" style="display:none;">
        <div class="container">
            <!-- Хедер -->
            <div class="header">
                <div class="balance">⭐ <span id="balance">0</span></div>
                <div class="free-spins">🎰 <span id="free-spins">0</span></div>
            </div>

            <!-- Вкладки -->
            <div class="tabs">
                <div class="tab active" data-tab="slots">🎰 Слоты</div>
                <div class="tab" data-tab="dice">🎲 Кубик</div>
                <div class="tab" data-tab="wheel">🎡 Колесо</div>
                <div class="tab" data-tab="pets">🐾 Питомцы</div>
            </div>

            <!-- Сторінка Слоти -->
            <div class="page active" id="page-slots">
                <div id="slot-machine">
                    <div class="reels" id="reels">
                        <div class="reel" id="reel1">🍒</div>
                        <div class="reel" id="reel2">🍋</div>
                        <div class="reel" id="reel3">🍊</div>
                    </div>
                    <div id="slot-status">Нажмите кнопку</div>
                </div>

                <button class="game-btn" onclick="playGame('slot', 25)">
                    🟢 Мини <span class="info">25⭐ | 0-5⭐ | 8%</span>
                </button>
                <button class="game-btn" onclick="playGame('slot', 50)">
                    🔵 Стандарт <span class="info">50⭐ | 0-10⭐ | 5%</span>
                </button>
                <button class="game-btn" onclick="playGame('slot', 100)">
                    🟣 Премиум <span class="info">100⭐ | 0-25⭐ | 2%</span>
                </button>
                <button class="game-btn free" onclick="playFree()">
                    🎁 Бесплатно <span class="info" id="free-count">(0)</span>
                </button>
            </div>

            <!-- Сторінка Кубик -->
            <div class="page" id="page-dice">
                <div class="dice-display" id="dice-display">⚀</div>
                
                <button class="game-btn" onclick="playGame('dice', 10)">
                    🎲 Простой <span class="info">10⭐ | x0-x5</span>
                </button>
                <button class="game-btn" onclick="playGame('dice', 25)">
                    🎲 Стандарт <span class="info">25⭐ | x0-x5</span>
                </button>
                <button class="game-btn" onclick="playGame('dice', 50)">
                    🎲 Высокий <span class="info">50⭐ | x0-x5</span>
                </button>
            </div>

            <!-- Сторінка Колесо -->
            <div class="page" id="page-wheel">
                <div class="wheel-container">
                    <div class="wheel-pointer">▼</div>
                    <div class="wheel" id="wheel"></div>
                </div>
                <div id="wheel-result">Нажмите кнопку</div>
                
                <button class="game-btn" onclick="playGame('wheel', 10)">
                    🎡 Колесо <span class="info">10⭐ | 0-10⭐</span>
                </button>
                <button class="game-btn" onclick="playGame('wheel', 25)">
                    🎡 Колесо <span class="info">25⭐ | 0-20⭐</span>
                </button>
                <button class="game-btn" onclick="playGame('wheel', 50)">
                    🎡 Колесо <span class="info">50⭐ | 0-50⭐</span>
                </button>
            </div>

            <!-- Сторінка Питомці -->
            <div class="page" id="page-pets">
                <div id="pets-list"></div>
                <div id="bonus-display">🐾 Бонус: +0%</div>
            </div>

            <!-- Результат -->
            <div class="result-box" id="result-box">
                <div id="result-content"></div>
            </div>

            <!-- Статистика -->
            <div class="stats">
                <div class="stat-item"><div class="value" id="stat-games">0</div><div class="label">Игр</div></div>
                <div class="stat-item"><div class="value" id="stat-win">0⭐</div><div class="label">Выиграно</div></div>
                <div class="stat-item"><div class="value" id="stat-pets">0</div><div class="label">Питомцы</div></div>
            </div>
        </div>
    </div>

    <!-- Нижня навігація -->
    <div class="bottom-nav">
        <div class="nav-item active" data-page="game">🎮 Игра</div>
        <div class="nav-item" data-page="promo">🏷️ Промокод</div>
        <div class="nav-item" data-page="profile">👤 Профиль</div>
    </div>

    <!-- Сторінка Промокод -->
    <div id="page-promo" style="display:none;padding:16px 20px;">
        <h2>🏷️ Промокод</h2>
        <div class="promo-input">
            <input type="text" id="promo-input" placeholder="Введите промокод">
            <button onclick="usePromo()">Активировать</button>
        </div>
        <div id="promo-result"></div>
        <div style="margin-top:16px;background:rgba(255,255,255,0.05);border-radius:12px;padding:16px;">
            <div style="font-weight:600;">Доступные промокоды:</div>
            <div id="promo-list"></div>
        </div>
    </div>

    <!-- Сторінка Профіль -->
    <div id="page-profile" style="display:none;padding:16px 20px;">
        <h2>👤 Профиль</h2>
        <div class="profile-card">
            <div class="profile-avatar">👤</div>
            <div class="profile-name" id="profile-name">Игрок</div>
            <div class="profile-id" id="profile-id">ID: 0</div>
        </div>
        <div class="profile-stats">
            <div><span class="value" id="p-balance">0⭐</span><span class="label">Баланс</span></div>
            <div><span class="value" id="p-spins">0</span><span class="label">Вращений</span></div>
            <div><span class="value" id="p-bonus">+0%</span><span class="label">Бонус</span></div>
        </div>
        <div class="profile-info">
            <div><span>🎮 Игр:</span><span id="p-games">0</span></div>
            <div><span>💰 Выиграно:</span><span id="p-win">0⭐</span></div>
            <div><span>🐾 Питомцев:</span><span id="p-pets">0</span></div>
        </div>
        <button class="withdraw-btn" onclick="withdraw()">💳 Вывод средств</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
